<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد إيميلات جيميل</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 30px;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 90%;
    }
    button {
      background: #4CAF50;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #45a049;
    }
    .output {
      text-align: left;
      margin-top: 20px;
      white-space: pre-wrap;
      background: #f0f0f0;
      padding: 15px;
      border-radius: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📧 مولد إيميلات جيميل</h2>
    <input type="text" id="baseEmail" placeholder="ادخل إيميلك الأساسي (@gmail.com)">
    <input type="number" id="count" placeholder="عدد النسخ (مثال: 50)" value="50">
    <button onclick="generateEmails()">توليد</button>
    <div class="output" id="output"></div>
  </div>

  <script>
    function generateEmails() {
      const baseEmail = document.getElementById('baseEmail').value.trim();
      const count = parseInt(document.getElementById('count').value);
      if (!baseEmail.includes('@gmail.com')) {
        alert('⚠️ لازم تدخل بريد جيميل صحيح!');
        return;
      }

      const [name, domain] = baseEmail.split('@');
      let result = '';

      // الطريقة الأولى: +
      for (let i = 1; i <= count/2; i++) {
        result += `${name}+${i}@${domain}\n`;
      }

      // الطريقة الثانية: النقاط
      for (let i = 1; i <= count/2; i++) {
        result += `${name.slice(0,4)}.${name.slice(4)}${i}@${domain}\n`;
      }

      document.getElementById('output').textContent = result;
    }
  </script>
</body>
</html>
